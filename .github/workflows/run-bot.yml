name: Run HZMINE Bot

on:
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов (в 00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch: {}   # Позволяет запустить бота вручную кнопкой

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Ограничение времени работы (чуть меньше 6 часов)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python bot.py
