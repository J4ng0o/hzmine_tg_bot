name: Start HZMINE Bot

on:
  workflow_dispatch: {}
  schedule:
    # Запуск каждые 4 часа (в 17 минут), чтобы избежать пиковой нагрузки
    - cron: '17 */4 * * *'

# Запрещаем одновременный запуск двух копий бота
concurrency:
  group: hzmine-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 3 часа 50 минут работы.
    # Зазор 10 минут до следующего запуска нужен, чтобы Telegram успел "отпустить" старый процесс
    timeout-minutes: 230

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          # ВАЖНО: Передаем URL воркера боту
          TELEGRAM_PROXY: ${{ secrets.TELEGRAM_PROXY }}
        run: |
          echo "Bot started at $(date -u)"
          python bot.py

  # Отдельная джоба: раз в месяц делает пустой коммит,
  # чтобы GitHub не отключил schedule из-за 60 дней неактивности
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Keep-alive commit (раз в ~30 дней)
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF=$(( (NOW - LAST) / 86400 ))
          if [ "$DIFF" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive $(date -u +%Y-%m-%d)"
            git push
            echo "Keep-alive commit created (last activity ${DIFF} days ago)"
          else
            echo "Skip keep-alive: last activity ${DIFF} days ago"
          fi
